<!DOCTYPE html>
<html>
<head>
  <title>Neon Hand Tracker</title>
  <style>
    body { margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; }
    h2 { color: #00ffcc; font-family: monospace; }
    video { display: none; }
    canvas { border: 2px solid #00ffcc; }
    #status { color: #00ffcc; font-family: monospace; font-size: 14px; }
  </style>
</head>
<body>
  <h2>🖐️ Neon Hand Tracker</h2>
  <p id="status">Loading MediaPipe...</p>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');

    canvas.width = 720;
    canvas.height = 540;

    const NEON_COLORS = [
      '#ff00ff', '#00ffff', '#00ff00', '#ffff00', '#ff8800',
      '#ff0088', '#88ff00', '#0088ff', '#ff4400', '#aa00ff'
    ];

    function drawNeonLine(x1, y1, x2, y2, color, width = 2) {
      // Outer glow
      for (let i = 6; i >= 1; i--) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = color;
        ctx.lineWidth = i * width;
        ctx.globalAlpha = 0.08;
        ctx.stroke();
      }
      // Bright core
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.globalAlpha = 1;
      ctx.stroke();
      // White center
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 0.5;
      ctx.globalAlpha = 1;
      ctx.stroke();
    }

    function drawNeonDot(x, y, color) {
      // Glow
      for (let i = 4; i >= 1; i--) {
        ctx.beginPath();
        ctx.arc(x, y, 4 + i * 4, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.08;
        ctx.fill();
      }
      // Core dot
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.globalAlpha = 1;
      ctx.fill();
      // White center
      ctx.beginPath();
      ctx.arc(x, y, 2, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 1;
      ctx.fill();
    }

    function getLandmarks(hand) {
      return hand.map(lm => ({
        x: (1 - lm.x) * canvas.width,
        y: lm.y * canvas.height
      }));
    }

    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      // Draw darkened video
      ctx.save();
      ctx.scale(-1, 1);
      ctx.translate(-canvas.width, 0);
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
      ctx.restore();

      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;

      const FINGERTIP_IDS = [4, 8, 12, 16, 20];
      const PALM_IDS = [0, 5, 9, 13, 17];

      // Get all hands' fingertips
      const allHandsData = results.multiHandLandmarks.map(hand => {
        const pts = getLandmarks(hand);
        return {
          fingertips: FINGERTIP_IDS.map(i => pts[i]),
          palm: PALM_IDS.map(i => pts[i]),
          all: pts
        };
      });

      // --- CROSS-HAND LINES (main effect) ---
      if (allHandsData.length === 2) {
        const tips0 = allHandsData[0].fingertips;
        const tips1 = allHandsData[1].fingertips;

        let colorIdx = 0;
        // Each fingertip of hand0 connects to each fingertip of hand1
        for (let i = 0; i < tips0.length; i++) {
          for (let j = 0; j < tips1.length; j++) {
            const color = NEON_COLORS[colorIdx % NEON_COLORS.length];
            drawNeonLine(tips0[i].x, tips0[i].y, tips1[j].x, tips1[j].y, color, 1.5);
            colorIdx++;
          }
        }
      }

      // --- SAME HAND lines + palm outline ---
      for (const handData of allHandsData) {
        const { fingertips, palm } = handData;

        // Fingertip to fingertip within same hand
        let colorIdx = 0;
        for (let i = 0; i < fingertips.length; i++) {
          for (let j = i + 1; j < fingertips.length; j++) {
            const color = NEON_COLORS[colorIdx % NEON_COLORS.length];
            drawNeonLine(fingertips[i].x, fingertips[i].y,
                         fingertips[j].x, fingertips[j].y, color, 1);
            colorIdx++;
          }
        }

        // Palm outline (golden)
        for (let i = 0; i < palm.length; i++) {
          const next = palm[(i + 1) % palm.length];
          drawNeonLine(palm[i].x, palm[i].y, next.x, next.y, '#ccaa00', 1);
        }

        // Dots on fingertips
        fingertips.forEach((tip, idx) => {
          drawNeonDot(tip.x, tip.y, NEON_COLORS[idx]);
        });
      }

      // HUD
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 15px monospace';
      ctx.fillText(`Hands: ${results.multiHandLandmarks.length} | Neon Hand Tracker`, 10, 25);
    });

    const camera = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 640, height: 480
    });

    camera.start()
      .then(() => { status.textContent = '✅ Camera active - Show both hands!'; })
      .catch(err => { status.textContent = '❌ Camera error: ' + err.message; });
  </script>
</body>
</html>
